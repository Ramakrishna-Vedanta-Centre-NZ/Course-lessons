<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What you bring is made of: manas biases, buddhi habits, ahamkara patterns and chitta samskaras</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEFCF9"/><stop offset="1" stop-color="#FBF7F0"/></linearGradient>
<linearGradient id="xg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1F4"/><stop offset="1" stop-color="#CFE0E8"/></linearGradient>
<radialGradient id="exp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FBEFC9"/><stop offset="1" stop-color="#EAD79E"/></radialGradient>
<linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF5F2"/><stop offset="1" stop-color="#CFE6E0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7EFD9"/><stop offset="1" stop-color="#ECDAA8"/></linearGradient>
<linearGradient id="ter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBECE0"/><stop offset="1" stop-color="#F4D2B9"/></linearGradient>
<linearGradient id="lav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE9F6"/><stop offset="1" stop-color="#DBD0EA"/></linearGradient>
<marker id="ar" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M1,0 L7,4 L1,8 Z" fill="#8A7A62"/></marker>
</defs>
<rect width="1500" height="1000" fill="url(#bg)"/>
<text x="750" y="92" text-anchor="middle" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#3D332A">What You Bring Is Made Of</text>
<text x="750" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#6B5D4A">From Lesson 1.1: experience is ψₓ met with ψₘ, what you bring. Now what you bring can be named.</text>
<rect x="90" y="380" width="250" height="150" rx="20" fill="url(#xg)"/>
<text x="215" y="442" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#214B5C">ψₓ</text>
<text x="215" y="478" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#3A6276">what is given,</text>
<text x="215" y="502" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#3A6276">the bare situation</text>

<text x="390" y="300" font-family="Georgia,serif" font-size="20" fill="#6B5D4A"><tspan font-weight="700" font-size="22" fill="#3D332A">What you bring:</tspan> the whole conditioned inner instrument</text>
<g font-family="Georgia,serif">
<rect x="390" y="330" width="470" height="58" rx="12" fill="url(#teal)"/><text x="414" y="368" font-size="20" fill="#235049"><tspan font-weight="700">Manas</tspan>: attentional biases</text>
<rect x="390" y="398" width="470" height="58" rx="12" fill="url(#gold)"/><text x="414" y="436" font-size="20" fill="#5C4410"><tspan font-weight="700">Buddhi</tspan>: habitual interpretations</text>
<rect x="390" y="466" width="470" height="58" rx="12" fill="url(#ter)"/><text x="414" y="504" font-size="20" fill="#7A4218"><tspan font-weight="700">Ahaṁkāra</tspan>: self-referential patterns</text>
<rect x="390" y="534" width="470" height="58" rx="12" fill="url(#lav)"/><text x="414" y="572" font-size="20" fill="#4A3F7A"><tspan font-weight="700">Chitta</tspan>: stored saṁskāras</text>
</g>
<line x1="340" y1="455" x2="384" y2="430" stroke="#8A7A62" stroke-width="3" marker-end="url(#ar)"/>
<line x1="864" y1="460" x2="980" y2="460" stroke="#8A7A62" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="1160" cy="460" r="135" fill="url(#exp)"/>
<text x="1160" y="450" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#6E5A2A">the experience</text>
<text x="1160" y="482" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#6E5A2A">you live</text>
<text x="750" y="730" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#5E5142">What you bring is not one thought to correct; it is the whole field, the shape of the riverbed.</text>
<text x="750" y="770" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-style="italic" fill="#6B5D4A">Changing it asks for sustained practice, not just momentary insight.</text>
</svg>
