<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Understanding Check: Lesson 3.3</title>
<meta name="description" content="Eight questions on Lesson 3.3, Saṁskāra as Live Filter, from The Mind in the Light of Modern and Spiritual Sciences.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400..700&display=swap">
<style>
:root{
 --bg:#FBF5EA; --surface:#FFFDF8; --ink:#1E1E1E; --muted:#5A5A5A; --line:#E6DAC3; --tint:#F3EAD3;
 --navy:#12285A; --gold:#C9A24A; --goldt:#6B4E0E; --qink:#13295B;
 --res:#12285A; --ok:#2F5A2E; --okbg:#E3EDDF; --no:#C2557A; --nobg:#F6E3EA;
 --display:"Noto Serif",Georgia,serif; --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#0B1A3D; --surface:#12285A; --ink:#FBF5EA; --muted:#C9C3B3; --line:#2B4686; --tint:#1D3770;
  --goldt:#E6C36A; --qink:#FBF5EA; --res:#E6C36A; --ok:#8FD79A; --okbg:#1E3A2A; --no:#F08FB0; --nobg:#4A2236; color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#0B1A3D; --surface:#12285A; --ink:#FBF5EA; --muted:#C9C3B3; --line:#2B4686; --tint:#1D3770;
 --goldt:#E6C36A; --qink:#FBF5EA; --res:#E6C36A; --ok:#8FD79A; --okbg:#1E3A2A; --no:#F08FB0; --nobg:#4A2236; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
 padding:18px max(14px,env(safe-area-inset-right,0px)) 30px max(14px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(24px,5vw,32px);line-height:1.15;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);margin:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--res);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.qn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.q{font-family:var(--display);font-size:clamp(19px,3.4vw,22px);line-height:1.35;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--res)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
input.fill{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input.fill:focus{outline:none;border-color:var(--res)}
.btn{font:inherit;font-weight:600;font-size:15px;color:var(--surface);background:var(--ink);border:0;border-radius:8px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--res);outline-offset:2px}
.fb{display:none;padding:12px 14px;border-radius:10px;font-size:15.5px;line-height:1.5}
.fb.ok{display:block;background:var(--okbg);border-left:5px solid var(--ok)}
.fb.no{display:block;background:var(--nobg);border-left:5px solid var(--no)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:flex-end}
.res{text-align:center}
.score{font-family:var(--display);margin:4px 0}
.score .big{font-size:60px;line-height:1}
.score .of{font-size:26px;color:var(--muted)}
.band{font-family:var(--display);font-size:22px;margin:0}
.band.good{color:var(--ok)} .band.rev{color:var(--res)}
.res p{margin:0}
.revisit{text-align:left;background:var(--tint);border-radius:10px;padding:12px 14px}
.revisit h2,.review h2{font-family:var(--display);font-size:18px;margin:0 0 6px}
.revisit ul{margin:0;padding-left:20px}
.review{text-align:left;display:flex;flex-direction:column;gap:8px}
.review .item{padding:10px 12px;border-radius:8px;font-size:15px;line-height:1.45}
.review .r{background:var(--okbg)} .review .w{background:var(--nobg)}
.review .item small{display:block;color:var(--muted);margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.saved{font-size:14px;color:var(--muted)}
footer{text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--res)}
.wrap header{background:#12285A;color:#FBF5EA;text-align:center;padding:18px 16px 20px;border-radius:14px}
.wrap header img{width:56px;height:66px;object-fit:contain;display:block}
.wrap header .logos{display:flex;align-items:center;justify-content:center;gap:18px}
.wrap header img.rit{width:86px;height:65px}
.wrap header .eyebrow{color:#E6C36A;font-weight:700;letter-spacing:3px;margin:8px 0 0}
.wrap header h1{color:#FBF5EA;font-weight:700;margin:6px 0 4px}
.wrap header .course{font-size:14px;color:#E6C36A;margin:0 0 8px;font-weight:600}
.wrap header .sub{color:#F1ECDF;font-size:15px}
.bar i{background:var(--gold)!important}
.opt:hover:not(:disabled){border-color:var(--gold)!important}
input.fill:focus{border-color:var(--gold)!important}
.q{color:var(--qink)}
.qn{color:var(--goldt);font-weight:700}
.btn{background:var(--navy)!important;color:#FBF5EA!important}
.btn.alt{background:transparent!important;color:var(--ink)!important;border:1px solid var(--navy)!important}
.card{box-shadow:0 2px 8px rgba(19,41,91,.08)}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="logos"><img src="vedantanz-logo.png" alt="Ramakrishna Vedanta NZ emblem" width="56" height="66"><img class="rit" src="ritam-wordmark.png" alt="Ritam" width="86" height="65"></div>
  <p class="eyebrow">Understanding check · Lesson 3.3</p>
  <h1>Saṁskāra as Live Filter</h1>
  <p class="course">The Mind in the Light of Modern and Spiritual Sciences · Advanced</p>
  <p class="sub">Eight questions on the lesson. Take them as often as you like; each answer comes with its explanation.</p>
 </header>
 <div class="bar"><i id="prog"></i></div>
 <div class="meta"><span id="pos"></span><span id="sc"></span></div>
 <div id="app"></div>
 <footer>Understanding check · <a href="https://www.vedanta.nz">www.vedanta.nz</a></footer>
</div>
<script>
/* Question bank. Types: mc (options o, correct index a), judge (statement q; a: 0 holds, 1 does not hold, 2 holds only in part), fill (accepted answers a[], show).
   e = explanation, c = idea to revisit, s = lesson section reference (null = lesson as a whole). All content from the 3.3 key ideas and misconceptions. */
var META={code:'ADV-3-3',lesson:'3.3',quizTitle:'Understanding check: Lesson 3.3, Saṁskāra as Live Filter',programme:'The Mind in the Light of Modern and Spiritual Sciences (Advanced)',cut:75};
var Q=[
{t:'mc',q:'What sets the way a tuning fork rings and settles after a strike?',o:['How hard it was struck','The room it is in','Its structure','The listener’s attention'],a:2,
 e:'A tuning fork’s impulse response, how it rings and settles, is set by its structure. In the lesson the mind’s h(t) plays the same part, and it is set by conditioning.',c:'The impulse response is set by the system’s own structure (the tuning fork)',s:'1'},
{t:'mc',q:'In ψexp = [ψₓ ∗ h] + ψₘ, what does h stand for?',o:['The height of the attention wave','The impulse response set by saṁskāras','The noise present in the moment','The body’s contribution'],a:1,
 e:'h(t) is what the past does to the incoming signal before attention meets it. The equation says the object wave is filtered by h and then met by the attention wave.',c:'What h(t) is, and where it sits in ψexp = [ψₓ ∗ h] + ψₘ',s:'3 and 13'},
{t:'mc',q:'Two people hear the same criticism and respond very differently. According to the lesson, the main reason is that:',o:['One of them hears it more accurately','Their h(t) differs','One of them is not paying attention','The criticism was not the same'],a:1,
 e:'The signal is the same. The filtering differs, because each person’s h(t) is shaped by a different history with similar input.',c:'The same input is filtered differently by different histories',s:'3'},
{t:'mc',q:'Which three features does the lesson name for reading an impulse response in lived experience?',o:['Amplitude, frequency, phase','Signal, noise, bandwidth','Settling time, overshoot, residual ripple','Frequency, amplitude, damping'],a:2,
 e:'Settling time, overshoot and residual ripple describe how a system responds and settles. Amplitude, frequency and phase describe a wave, as in Module 2. They are not the features of an impulse response.',c:'The three features of a response: settling time, overshoot, residual ripple',s:'1'},
{t:'mc',q:'In the holographic picture of memory, what is recorded?',o:['A copy of the event alone','A single location in time','Only the words that were spoken','The interference of the event with the inner state'],a:3,
 e:'What is held is the interference pattern of event and inner state, distributed rather than stored at one place. A cue that shares the signature can bring back event, reaction and meaning together.',c:'Memory held as a distributed interference pattern, reconstructed by a cue',s:'6'},
{t:'judge',q:'“A well-damped mind is one that has suppressed its reactions.”',a:1,
 e:'Damping means a proportionate response that settles quickly. It does not mean suppression or numbness.',c:'Damping means proportion and quicker settling, not suppression',s:null},
{t:'judge',q:'“If you see your conditioning clearly, it stops operating.”',a:2,
 e:'Buddhi can recognise “this is my conditioned version” while the reaction is still felt. Seeing loosens the hold of the pattern and is among the things that help damping, but the lesson does not say the pattern simply stops.',c:'Seeing the pattern loosens it; buddhi can see it while it is still felt',s:null},
{t:'fill',q:'The Fourier transform of h(t), which says which kinds of signal the mind amplifies or reduces, is called the ______ function.',a:['transfer','transfer function','Hf','H(f)'],show:'transfer',
 e:'H(f), the transfer function, is the frequency-domain view of the same conditioning.',c:'H(f), the transfer function, as the frequency view of h(t)',s:'4'}
];
(function(){
 var q=new URLSearchParams(location.search);
 if(q.get('theme')==='light')document.documentElement.setAttribute('data-theme','light');
 if(q.get('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');
})();
var i=0,right=0,ans=[],saved=false;
var app=document.getElementById('app');
var JL=['Holds','Does not hold','Holds only in part'];
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hdr(){
 document.getElementById('pos').textContent=i<Q.length?'Question '+(i+1)+' of '+Q.length:'Finished';
 document.getElementById('sc').textContent=i<Q.length?right+' right so far':'';
 document.getElementById('prog').style.width=(100*Math.min(i,Q.length)/Q.length)+'%';
}
function send(m){try{window.parent.postMessage(m,'*')}catch(e){}}
function ref(s){return s?'Lesson 3.3, section '+s:'Lesson 3.3'}
function show(){
 hdr();
 if(i>=Q.length){return result()}
 var qq=Q[i];
 var h='<div class="card"><p class="qn">Question '+(i+1)+'</p><p class="q">'+esc(qq.q)+'</p>';
 if(qq.t==='mc'){h+='<div class="opts">';qq.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>'});h+='</div>'}
 else if(qq.t==='judge'){h+='<div class="opts">';JL.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+o+'</button>'});h+='</div>'}
 else{h+='<input class="fill" id="fill" type="text" autocomplete="off" autocapitalize="off" placeholder="Type your answer"><div><button class="btn" id="chk">Check answer</button></div>'}
 h+='<div class="fb" id="fb" role="status"></div><div class="nav"><button class="btn" id="nx" style="display:none">'+(i===Q.length-1?'See my result':'Next question')+'</button></div></div>';
 app.innerHTML=h;
 if(qq.t!=='fill'){app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){mark(+b.dataset.k===qq.a,b)}})}
 else{var f=document.getElementById('fill');
  document.getElementById('chk').onclick=function(){
   if(!f.value.trim()){f.focus();return}
   var ok=qq.a.some(function(x){return norm(f.value)===norm(x)});
   f.disabled=true;this.style.display='none';mark(ok,null,f.value)};
  f.onkeydown=function(e){if(e.key==='Enter')document.getElementById('chk').click()};f.focus()}
 document.getElementById('nx').onclick=function(){i++;show();window.scrollTo(0,0)};
}
function mark(ok,btn,typed){
 started=true;
 var qq=Q[i];if(ok)right++;ans.push({q:i+1,ok:ok,given:typed!==undefined?typed:(btn?btn.textContent:'')});
 if(qq.t!=='fill'){app.querySelectorAll('.opt').forEach(function(b,k){b.disabled=true;if(k===qq.a)b.classList.add('right')});if(!ok&&btn)btn.classList.add('wrong')}
 var right_ans=qq.t==='mc'?qq.o[qq.a]:qq.t==='judge'?JL[qq.a]:qq.show;
 var fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML='<b>'+(ok?'Right.':'Not quite. The answer is: '+esc(right_ans))+'</b>'+esc(qq.e)+' <i>('+ref(qq.s)+'.)</i>';
 document.getElementById('nx').style.display='inline-block';hdr();
 send({type:'progress',code:META.code,state:{i:i+1,right:right,ans:ans}});
}
function result(){
 var n=Q.length,p=Math.round(100*right/n),good=p>=META.cut;
 var h='<div class="card res"><p class="qn">Your result</p><p class="score"><span class="big">'+p+'%</span></p>'+
  '<p class="band '+(good?'good':'rev')+'">'+(good?'Well grasped':'Revisit these ideas')+'</p>'+
  '<p>'+right+' of '+n+' questions right.</p>';
 var miss=[];Q.forEach(function(qq,k){if(!ans[k]||!ans[k].ok)miss.push(qq)});
 if(miss.length){h+='<div class="revisit"><h2>Ideas to revisit</h2><ul>';miss.forEach(function(qq){h+='<li>'+esc(qq.c)+' <i>('+ref(qq.s)+')</i></li>'});h+='</ul></div>'}
 else{h+='<div class="revisit"><h2>Nothing to revisit</h2><p>Every idea in this check was answered correctly.</p></div>'}
 h+='<div class="review"><h2>Every question, with its answer</h2>';
 Q.forEach(function(qq,k){var ok=ans[k]&&ans[k].ok;var a=qq.t==='mc'?qq.o[qq.a]:qq.t==='judge'?JL[qq.a]:qq.show;
  h+='<div class="item '+(ok?'r':'w')+'">'+(ok?'Right. ':'Not quite. ')+'<b>Q'+(k+1)+'</b> '+esc(qq.q)+'<br>Answer: '+esc(a)+'<small>'+esc(qq.e)+' ('+ref(qq.s)+')</small></div>'});
 h+='</div><p class="saved" id="savedmsg"></p><div class="acts"><button class="btn" id="again">Take it again</button></div></div>';
 app.innerHTML=h;
 document.getElementById('again').onclick=function(){i=0;right=0;ans=[];saved=false;show();window.scrollTo(0,0)};
 send({type:'quizResult',code:META.code,title:META.quizTitle,programme:META.programme,score:right,maxScore:n,percent:p,questionsCorrect:right,questionCount:n,answers:ans});
 send({type:'progress',code:META.code,state:null});
}
window.addEventListener('message',function(ev){
 var d=ev.data;if(!d||!d.type)return;
 var m=document.getElementById('savedmsg');
 if(d.type==='saved'&&m){m.textContent='Your result has been saved to your member record.'}
 if(d.type==='saveError'&&m){m.textContent='Your result could not be saved this time. You can take the check again.'}
 if(d.type==='notMember'&&m){m.textContent='Sign in as a member to have your result saved.'}
 if(d.type==='resume'&&d.state&&d.state.i>0&&d.state.i<Q.length&&!started){offerResume(d.state)}
});
var started=false;
function offerResume(st){
 var h='<div class="card"><p class="qn">Welcome back</p><p class="q">You have answered '+st.i+' of '+Q.length+' questions so far.</p><p>Would you like to continue where you left off, or start again from the beginning?</p><div class="acts"><button class="btn" id="cont">Continue from question '+(st.i+1)+'</button><button class="btn alt" id="rest">Start again</button></div></div>';
 app.innerHTML=h;
 document.getElementById('cont').onclick=function(){i=st.i;right=st.right||0;ans=st.ans||[];started=true;show()};
 document.getElementById('rest').onclick=function(){i=0;right=0;ans=[];started=true;show()};
}
show();
send({type:'ready'});
</script>
</body>
</html>
